<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="auto">
  <defs>
    <linearGradient id="retro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="100%" stop-color="#151b3d" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#252e5a" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="840" height="320" rx="12" fill="url(#retro-bg)" stroke="#3b487e" stroke-width="1.5" />
  <rect width="840" height="320" rx="12" fill="url(#grid)" />

  <!-- Pixel / Retro Accents -->
  <text x="36" y="46" fill="#60a5fa" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold">✦ [ 3D_CONTRIBUTION_GRAPH :: TOPOGRAPHY ]</text>
  <text x="730" y="46" fill="#c084fc" font-family="'Courier New', Courier, monospace" font-size="12">✦ ✧ ✦</text>

  <!-- Center Decorative Isometric Wireframe Projection -->
  <g transform="translate(420, 165)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Isometric Base Plinth -->
    <polygon points="0,-45 160,35 0,115 -160,35" fill="#141a3a" stroke="#4f46e5" stroke-width="1.2" opacity="0.8" />
    
    <!-- Stylized 3D Cubes Preview -->
    <!-- Col 1 -->
    <g transform="translate(-70, 0)">
      <polygon points="0,-25 24,-11 0,3 -24,-11" fill="#93c5fd" opacity="0.9"/>
      <polygon points="-24,-11 0,3 0,35 -24,21" fill="#3b82f6"/>
      <polygon points="0,3 24,-11 24,21 0,35" fill="#1d4ed8"/>
    </g>
    <!-- Col 2 (Peak) -->
    <g transform="translate(-25, -25)">
      <polygon points="0,-40 24,-26 0,-12 -24,-26" fill="#fbcfe8" opacity="0.95"/>
      <polygon points="-24,-26 0,-12 0,40 -24,26" fill="#ec4899"/>
      <polygon points="0,-12 24,-26 24,26 0,40" fill="#be185d"/>
    </g>
    <!-- Col 3 -->
    <g transform="translate(20, -10)">
      <polygon points="0,-30 24,-16 0,-2 -24,-16" fill="#e9d5ff" opacity="0.9"/>
      <polygon points="-24,-16 0,-2 0,30 -24,16" fill="#a855f7"/>
      <polygon points="0,-2 24,-16 24,16 0,30" fill="#7e22ce"/>
    </g>
    <!-- Col 4 -->
    <g transform="translate(65, 10)">
      <polygon points="0,-20 24,-6 0,8 -24,-6" fill="#fef08a" opacity="0.9"/>
      <polygon points="-24,-6 0,8 0,22 -24,8" fill="#eab308"/>
      <polygon points="0,8 24,-6 24,8 0,22" fill="#ca8a04"/>
    </g>
  </g>

  <!-- Status Bar and Info -->
  <line x1="36" y1="260" x2="804" y2="260" stroke="#2a3563" stroke-width="1" />
  <text x="420" y="285" text-anchor="middle" fill="#94a3b8" font-family="'Courier New', Courier, monospace" font-size="12">
    Workflow configured in <tspan fill="#93c5fd">.github/workflows/profile-3d.yml</tspan> · Real-time telemetry generates upon initial dispatch
  </text>
</svg>
